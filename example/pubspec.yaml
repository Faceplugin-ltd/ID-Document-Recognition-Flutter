name: document_reader_sdk_example
description: FacePlugin DocumentReader Flutter demo
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  document_reader_sdk:
    path: ../
  camera: ^0.12.0+2
  image: ^4.3.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  go_router: ^14.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Repo folder DocumentReader-Flutter-App ≠ package document_reader_sdk.
  # Flutter SPM uses the real path basename for local path plugins, which
  # breaks resolution (flutter/flutter#186881). CocoaPods remains fully
  # supported; Package.swift still ships for pub.dev / matching checkouts.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
